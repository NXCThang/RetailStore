server:
    port: 9999
    servlet:
        context-path: /nxc-dev

spring:
    jpa:
        show-sql: true
        properties:
            hibernate:
                format_sql: false
        hibernate:
            ddl-auto: update
    datasource:
        url: jdbc:postgresql://localhost:54647/retailstore_test
        username: retailstore
        password: retailstore_test
        driver-class-name: org.postgresql.Driver
    mvc:
        pathmatch:
            matching-strategy: ant_path_matcher
